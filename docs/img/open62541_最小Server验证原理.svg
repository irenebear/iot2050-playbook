<svg viewBox="0 0 680 470" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>最小 open62541 Server 代码验证原理</title>
  <desc>四步流程：创建服务器 → 配置默认 → 运行监听 → 清理退出，验证库是否可用</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="28" font-size="14" font-weight="500" fill="#2C2C2A">这段代码的 4 个动作</text>

  <g>
    <rect x="40" y="48" width="600" height="52" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="60" y="70" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">① UA_Server_new()</text>
    <text x="300" y="70" font-size="12" fill="#185FA5" dominant-baseline="central">创建服务器对象（分配内存）</text>
  </g>

  <g>
    <line x1="340" y1="100" x2="340" y2="118" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="40" y="118" width="600" height="52" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text x="60" y="140" font-size="13" font-weight="500" fill="#27500A" dominant-baseline="central">② UA_ServerConfig_setDefault()</text>
    <text x="340" y="140" font-size="12" fill="#3B6D11" dominant-baseline="central">填充默认配置（端口 4840、地址空间等）</text>
  </g>

  <g>
    <line x1="340" y1="170" x2="340" y2="188" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="40" y="188" width="600" height="52" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="60" y="210" font-size="13" font-weight="500" fill="#633806" dominant-baseline="central">③ UA_Server_run(server, &amp;false)</text>
    <text x="340" y="210" font-size="12" fill="#854F0B" dominant-baseline="central">启动服务器，监听 4840，直到中断</text>
  </g>

  <g>
    <line x1="340" y1="240" x2="340" y2="258" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="40" y="258" width="600" height="52" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="60" y="280" font-size="13" font-weight="500" fill="#444441" dominant-baseline="central">④ UA_Server_delete()</text>
    <text x="340" y="280" font-size="12" fill="#5F5E5A" dominant-baseline="central">清理释放（进程正常退出）</text>
  </g>

  <g>
    <rect x="40" y="330" width="600" height="120" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="60" y="354" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">它能验证什么（安装层面的验证）</text>
    <text x="60" y="378" font-size="12" fill="#0F6E56" dominant-baseline="central">✅ 头文件存在（编译通过）✅ 库已链接（gcc -lopen62541 成功）</text>
    <text x="60" y="398" font-size="12" fill="#0F6E56" dominant-baseline="central">✅ 运行时库正常（能起服务）✅ 端口 4840 能监听（ss 验证）</text>
    <text x="60" y="420" font-size="12" fill="#0F6E56" dominant-baseline="central">✅ 版本兼容（1.4 API 调用正确，不崩）</text>
    <text x="60" y="440" font-size="12" fill="#0F6E56" dominant-baseline="central">⚠️ 它验证不了通信本身（没有客户端来连、没有数据）</text>
  </g>
</svg>
